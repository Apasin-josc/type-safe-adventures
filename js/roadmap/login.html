<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <title>JS Quest</title>
    <style>
      :root { --bg: #12141c; --panel: #1b1e2a; --line: #2c3142; --text: #e9ecf5; --muted: #a2a9bd; --gold: #f2c14e; --bad: #ff7a7a; }
      @media (prefers-color-scheme: light) {
        :root { --bg: #f4f1ea; --panel: #fffdf8; --line: #d9d2c2; --text: #22252f; --muted: #5d6475; --gold: #855d04; --bad: #b3261e; }
      }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--text);
        font: 16px/1.5 system-ui, -apple-system, 'Segoe UI', sans-serif; }
      form { width: min(360px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 24px; }
      h1 { margin: 0 0 4px; font-size: 1.5rem; }
      p { margin: 0 0 18px; color: var(--muted); font-size: 0.92rem; }
      label { display: block; font-weight: 700; font-size: 0.85rem; margin: 12px 0 4px; }
      input { width: 100%; padding: 11px 12px; font: inherit; color: inherit; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; }
      input:focus-visible, button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
      button { width: 100%; margin-top: 20px; padding: 12px; font: inherit; font-weight: 800; color: #1a1300; background: #f2c14e; border: 0; border-radius: 8px; cursor: pointer; }
      button:disabled { opacity: 0.6; cursor: default; }
      #err { min-height: 1.5em; margin: 12px 0 0; color: var(--bad); font-size: 0.9rem; }
    </style>
  </head>
  <body>
    <form id="f" autocomplete="on">
      <h1>⚔ JS Quest</h1>
      <p id="sub"></p>
      <label for="name" id="l-name"></label>
      <input id="name" name="username" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required />
      <label for="password" id="l-pass"></label>
      <input id="password" name="password" type="password" autocomplete="current-password" required />
      <button id="go" type="submit"></button>
      <p id="err" role="alert"></p>
    </form>
    <script>
      (function () {
        var es = (navigator.language || 'es').toLowerCase().indexOf('es') === 0;
        document.documentElement.lang = es ? 'es' : 'en';
        var T = es
          ? { sub: 'Entra con tu usuario para seguir tu aventura.', name: 'Usuario', pass: 'Contraseña', go: 'Entrar',
              bad: 'Usuario o contraseña incorrectos.', locked: function (s) { return 'Demasiados intentos. Espera ' + s + ' s.'; }, net: 'No pude conectar con el servidor.' }
          : { sub: 'Sign in to continue your adventure.', name: 'Username', pass: 'Password', go: 'Sign in',
              bad: 'Wrong username or password.', locked: function (s) { return 'Too many attempts. Wait ' + s + 's.'; }, net: 'Couldn’t reach the server.' };
        var $ = function (id) { return document.getElementById(id); };
        $('sub').textContent = T.sub; $('l-name').textContent = T.name; $('l-pass').textContent = T.pass; $('go').textContent = T.go;
        $('f').addEventListener('submit', function (e) {
          e.preventDefault();
          $('go').disabled = true; $('err').textContent = '';
          fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name: $('name').value.trim(), password: $('password').value }) })
            .then(function (res) { return res.json().then(function (d) { return { ok: res.ok, d: d }; }); })
            .then(function (r) {
              if (r.ok) return location.reload();
              $('err').textContent = r.d.error === 'locked' ? T.locked(r.d.wait) : T.bad;
              $('go').disabled = false;
            })
            .catch(function () { $('err').textContent = T.net; $('go').disabled = false; });
        });
      })();
    </script>
  </body>
</html>
